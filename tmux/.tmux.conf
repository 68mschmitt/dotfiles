unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix
bind-key b set-option status
set-window-option -g mode-keys vi

# image.nvim config
set -g allow-passthrough on
set -g visual-activity off

set -g extended-keys on
set -g extended-keys-format csi-u

# Options to make tmux more pleasant
set -g mouse on

# Terminal capabilities for proper underline/undercurl rendering
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Source - https://superuser.com/a/1877683
# Posted by maniacalrobot
# Retrieved 2026-07-15, License - CC BY-SA 4.0

set-option -g pane-active-border-style fg=white
set-option -g pane-border-lines double
set-option -g pane-border-indicators arrows
set-option -g pane-border-status top



# === Status Bar Configuration ===
# Show status bar at the bottom with Claude Code usage metrics

# Enable and style the status bar
set -g status on
set -g status-position bottom
set -g status-bg '#1e1e1e'
set -g status-fg '#e0e0e0'

# Status line refresh interval (in seconds)
# We use 10s here, but the actual API calls are rate-limited by the scripts
set -g status-interval 10

# Left side: session info
set -g status-left "#[fg=#569cd6,bold]#{session_name}#[fg=#e0e0e0,nobold] "
set -g status-left-length 20

# Right side: Claude usage + time
# The tmux-claude-status.sh script reads cached data and triggers background refreshes
set -g status-right "#($HOME/projects/dotfiles/scripts/tmux-claude-status.sh) #[fg=#858585]%H:%M"
set -g status-right-length 50

# Window list styling
set -g window-status-format "#[fg=#858585]#I: #W"
set -g window-status-current-format "#[fg=#569cd6,bold]●#[fg=#e0e0e0,bold] #I: #W#[fg=#569cd6,nobold]"
set -g window-status-separator " "
set -g window-status-style "bg=#1e1e1e,fg=#858585"
set -g window-status-current-style "bg=#1e1e1e,fg=#e0e0e0"

# Message styles
set -g message-style "bg=#569cd6,fg=#1e1e1e,bold"
set -g message-command-style "bg=#569cd6,fg=#1e1e1e"
